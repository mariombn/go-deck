# Runners nativos: Wails depende dos webviews de cada SO e macOS usa CGO.
# Release publicado -> anexos no GitHub; execução manual -> artifacts do run.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: build/bin/go-deck.exe
          - os: macos-latest
            asset: build/bin/go-deck-macos.zip
          # glibc 2.35: mantém compatibilidade com Ubuntu 22.04 e distros recentes.
          - os: ubuntu-22.04
            asset: |
              build/release/*.AppImage
              build/release/*.deb
              build/release/*.rpm
              build/release/*.sha256

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependências nativas Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            desktop-file-utils rpm cpio

      - name: Instalar a CLI do Wails (mesma versão do go.mod)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Validar ícones gerados
        if: runner.os == 'Linux'
        run: python3 scripts/check-icons.py

      - name: Wails build (Windows/macOS)
        if: runner.os != 'Linux'
        run: wails build

      - name: Wails build (Linux / WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: wails build -tags webkit2_41

      - name: Empacotar .app (macOS)
        if: runner.os == 'macOS'
        run: cd build/bin && zip -r go-deck-macos.zip go-deck.app

      - name: Ferramentas de empacotamento Linux (versões e SHA-256 fixos)
        if: runner.os == 'Linux'
        env:
          PACKAGING_TOOLS_DIR: ${{ runner.temp }}/go-deck-packaging
        run: |
          bash scripts/install-linux-packaging-tools.sh
          echo "$PACKAGING_TOOLS_DIR" >> "$GITHUB_PATH"

      - name: Gerar AppImage, .deb e .rpm
        if: runner.os == 'Linux'
        env:
          # Dados do evento entram por env, nunca interpolados num comando.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="${RELEASE_TAG:-0.0.0-dev.${RUN_NUMBER}}"
          bash scripts/package-linux.sh "$version"
          bash scripts/check-linux-packages.sh "${version#v}"

      - name: Anexar ao release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ matrix.asset }}
          fail_on_unmatched_files: true

      - name: Subir artifact (run manual)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: go-deck-${{ runner.os }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

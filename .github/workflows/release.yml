# Runners nativos: Wails depende dos webviews de cada SO e macOS usa CGO.
# Tag v* -> compila, valida e publica o release somente após todos os builds.
# Release publicado manualmente -> atualiza anexos; workflow_dispatch -> artifacts.
name: release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: build/bin/go-deck.exe
          - os: macos-latest
            asset: build/bin/go-deck-macos.zip
          # glibc 2.35: mantém compatibilidade com Ubuntu 22.04 e distros recentes.
          - os: ubuntu-22.04
            asset: |
              build/release/*.AppImage
              build/release/*.deb
              build/release/*.rpm
              build/release/*.sha256

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Normalizar versão e atualizar metadados nativos
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || (github.event_name == 'push' && github.ref_name) || '' }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version="$(bash scripts/normalize-release-version.sh "${RELEASE_TAG:-0.0.0-dev.${RUN_NUMBER}}")"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          node scripts/set-build-version.mjs "$version"

      - name: Dependências nativas Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev \
            desktop-file-utils rpm cpio

      - name: Instalar a CLI do Wails (mesma versão do go.mod)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Validar ícones gerados
        if: runner.os == 'Linux'
        run: python3 scripts/check-icons.py

      - name: Wails build (Windows/macOS)
        if: runner.os != 'Linux'
        run: wails build

      - name: Wails build (Linux / WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: wails build -tags webkit2_41

      - name: Empacotar .app (macOS)
        if: runner.os == 'macOS'
        run: cd build/bin && zip -r go-deck-macos.zip go-deck.app

      - name: Ferramentas de empacotamento Linux (versões e SHA-256 fixos)
        if: runner.os == 'Linux'
        env:
          PACKAGING_TOOLS_DIR: ${{ runner.temp }}/go-deck-packaging
        run: |
          bash scripts/install-linux-packaging-tools.sh
          echo "$PACKAGING_TOOLS_DIR" >> "$GITHUB_PATH"

      - name: Gerar AppImage, .deb e .rpm
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          bash scripts/package-linux.sh "$VERSION"
          bash scripts/check-linux-packages.sh "$VERSION"

      - name: Guardar pacotes validados
        uses: actions/upload-artifact@v4
        with:
          name: go-deck-${{ runner.os }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publicar release e pacotes
    needs: build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Baixar todos os pacotes
        uses: actions/download-artifact@v4
        with:
          pattern: go-deck-*
          merge-multiple: true
          path: dist

      - name: Preparar notas e validar a tag
        id: notes
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          bash scripts/normalize-release-version.sh "$RELEASE_TAG"
          notes="docs/release-notes/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = push ]; then
            echo "::error::Faltam as notas completas em $notes"
            exit 1
          fi

      - name: Checksums de todos os instaladores/binários
        working-directory: dist
        run: sha256sum go-deck.exe go-deck-macos.zip *.AppImage *.deb *.rpm > SHA256SUMS

      # GITHUB_TOKEN não dispara outro workflow de release, evitando duplicação
      # após a publicação iniciada pela tag. Não depende de PAT pessoal.
      - name: Publicar notas e anexar todos os pacotes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: ${{ github.event.release.tag_name || github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          make_latest: "true"
          files: |
            dist/go-deck.exe
            dist/go-deck-macos.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
            dist/SHA256SUMS
          fail_on_unmatched_files: true

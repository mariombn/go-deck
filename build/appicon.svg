<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <title>go-deck</title>
  <desc>Deck de nove teclas em azul-noite, com uma tecla de ação iluminada em ciano e índigo.</desc>
  <defs>
    <linearGradient id="base" x1="156" y1="88" x2="844" y2="968" gradientUnits="userSpaceOnUse">
      <stop stop-color="#202E57"/>
      <stop offset="0.48" stop-color="#101B38"/>
      <stop offset="1" stop-color="#090F23"/>
    </linearGradient>
    <linearGradient id="rim" x1="206" y1="202" x2="808" y2="844" gradientUnits="userSpaceOnUse">
      <stop stop-color="#718BC4"/>
      <stop offset="0.45" stop-color="#334568"/>
      <stop offset="1" stop-color="#1C2A48"/>
    </linearGradient>
    <linearGradient id="body" x1="234" y1="218" x2="772" y2="844" gradientUnits="userSpaceOnUse">
      <stop stop-color="#233454"/>
      <stop offset="1" stop-color="#111B32"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop stop-color="#405780"/>
      <stop offset="1" stop-color="#253757"/>
    </linearGradient>
    <linearGradient id="action" x1="438" y1="440" x2="586" y2="588" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.45" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8797F5"/>
      <stop offset="1" stop-color="#535AB4"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(512 504) scale(430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="112" y="164" width="800" height="772" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24" result="blur"/>
      <feOffset in="blur" dy="24" result="offset"/>
      <feFlood flood-color="#020617" flood-opacity="0.55" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="cap">
      <rect y="7" width="144" height="144" rx="32" fill="#080F21"/>
      <rect width="144" height="144" rx="32" fill="url(#key)"/>
      <rect x="1" y="1" width="142" height="142" rx="31" stroke="#A3B9E8" stroke-opacity="0.14" stroke-width="2"/>
      <path d="M38 16H106" stroke="#BFD2F6" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#base)"/>
  <rect x="48" y="48" width="928" height="928" rx="216" fill="url(#halo)"/>
  <rect x="50" y="50" width="924" height="924" rx="214" stroke="#A5B4FC" stroke-opacity="0.16" stroke-width="4"/>
  <g filter="url(#shadow)">
    <rect x="184" y="196" width="656" height="648" rx="88" fill="url(#rim)"/>
    <rect x="190" y="202" width="644" height="636" rx="82" fill="url(#body)"/>
    <use href="#cap" x="244" y="252"/>
    <use href="#cap" x="440" y="252"/>
    <use href="#cap" x="636" y="252"/>
    <rect x="244" y="252" width="144" height="144" rx="32" fill="url(#accent)" opacity="0.85"/>
    <path d="M290 324H342M316 298V350" stroke="#E0E7FF" stroke-width="12" stroke-linecap="round"/>
    <use href="#cap" x="244" y="436"/>
    <use href="#cap" x="440" y="436"/>
    <use href="#cap" x="636" y="436"/>
    <rect x="440" y="436" width="144" height="144" rx="32" fill="url(#action)"/>
    <rect x="442" y="438" width="140" height="140" rx="30" stroke="white" stroke-opacity="0.35" stroke-width="3"/>
    <path d="M496 476C491 473 486 476 486 482V534C486 540 491 543 496 540L542 514C547 511 547 505 542 502L496 476Z" fill="white"/>
    <use href="#cap" x="244" y="620"/>
    <use href="#cap" x="440" y="620"/>
    <use href="#cap" x="636" y="620"/>
    <rect x="674" y="658" width="68" height="68" rx="19" stroke="#5EEAD4" stroke-width="10" opacity="0.9"/>
    <rect x="478" y="800" width="68" height="8" rx="4" fill="#5EEAD4"/>
  </g>
</svg>
